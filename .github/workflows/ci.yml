name: CI

on:
  push:
    branches: [main]
  pull_request:

# The eval suite is deliberately not here. It costs real API money per run and
# scores anywhere from 4/9 to 7/9 on identical code, so gating merges on it
# would charge you to fail randomly. Run it by hand against a change you care
# about, and judge it over two or three runs. See eval-on-demand.yml.

jobs:
  lint:
    name: Syntax and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Node syntax
        run: |
          for f in server.js app.js eval/run.js; do
            node --check "$f" && echo "ok  $f"
          done

      - name: Python syntax
        run: python3 -m compileall -q preprocess eval

      - name: No credentials committed
        run: |
          # The repo leaked a key through .env.example once. Cheap insurance.
          if grep -rIE 'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}' . \
               --exclude-dir=.git --exclude-dir=.github; then
            echo "::error::A live-looking Anthropic key is present in the tree"
            exit 1
          fi
          echo "no key material found"

      - name: Secrets are not tracked
        run: |
          for f in .env local.env usage.json server.log; do
            if git ls-files --error-unmatch "$f" 2>/dev/null; then
              echo "::error::$f is tracked and must not be"
              exit 1
            fi
          done
          echo "no sensitive files tracked"

  image:
    name: Docker image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t brickcheck:ci .

      - name: Python stack actually works inside the image
        run: |
          # "It built" is not "it works" — a broken OpenCV still imports far
          # enough to fool a smoke test, so exercise the real scripts.
          docker run --rm brickcheck:ci \
            /app/preprocess/.venv/bin/python3 -c \
            "import cv2, numpy, skimage; print('opencv', cv2.__version__)"

      - name: Starts, serves, and gates on the password
        run: |
          docker run -d --name ci -p 3000:3000 -e APP_PASSWORD=ci-test brickcheck:ci

          # Wait for the startup banner, NOT for the port. listen() binds before
          # its callback runs, and that callback awaits a Python probe first, so
          # the server answers HTTP a few hundred ms before it has logged
          # anything. Polling the port meant this job read an empty log and
          # failed at random. Waiting on the last line printed means all of them
          # are present.
          ready=
          for _ in $(seq 1 45); do
            case "$(docker logs ci 2>&1)" in
              *"Password protection enabled"*|*"No APP_PASSWORD set"*) ready=1; break ;;
            esac
            sleep 2
          done

          logs=$(docker logs ci 2>&1)
          echo "$logs"

          if [ -z "$ready" ]; then
            echo "::error::container never finished starting within 90s"
            docker inspect -f 'state={{.State.Status}} exit={{.State.ExitCode}}' ci || true
            exit 1
          fi

          # The failure this guards against is silent: without the Python
          # layer the app still answers, just much worse.
          echo "$logs" | grep -q "Image processing enabled" \
            || { echo "::error::Python image processing did not come up"; exit 1; }
          echo "$logs" | grep -q "Password protection enabled" \
            || { echo "::error::APP_PASSWORD was not honoured"; exit 1; }

          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "401" \
            || { echo "::error::unauthenticated request was not rejected"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -u u:ci-test http://127.0.0.1:3000/)" = "200" \
            || { echo "::error::authenticated request was rejected"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -u u:ci-test http://127.0.0.1:3000/.env)" = "404" \
            || { echo "::error::static allowlist is not holding"; exit 1; }

          echo "image starts, gates on the password, and serves only allowlisted files"

      - name: A reference photo is required
        run: |
          body=$(curl -s -u u:ci-test -X POST http://127.0.0.1:3000/api/analyze \
            -H 'Content-Type: application/json' \
            -d '{"image":"data:image/jpeg;base64,/9j/4AAQSkZJRg=="}')
          echo "$body"
          echo "$body" | grep -q "reference photo" \
            || { echo "::error::a build-only request was not rejected"; exit 1; }

  infra:
    name: Terraform config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1

      - run: tofu fmt -check -recursive
        working-directory: deploy/terraform

      - run: tofu init -backend=false -input=false
        working-directory: deploy/terraform

      - run: tofu validate
        working-directory: deploy/terraform
